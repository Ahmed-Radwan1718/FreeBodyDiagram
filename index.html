<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple free-body diagram maker." />
    <title>Free Body Diagram Maker</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Diagram tools">
        <nav class="tool-rail" aria-label="Tool categories">
          <button class="tool-button" type="button" data-panel="shapes" aria-expanded="false" title="Shapes">
            <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3.5" y="4" width="10" height="10" rx="2"></rect>
              <circle cx="15.5" cy="15.5" r="5"></circle>
            </svg>
            <span class="tool-label">Shapes</span>
          </button>

          <button class="tool-button" type="button" data-panel="forces" aria-expanded="false" title="Forces">
            <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 19 18 6"></path>
              <path d="M11.5 6H18v6.5"></path>
              <circle cx="5" cy="19" r="1.6"></circle>
            </svg>
            <span class="tool-label">Forces</span>
          </button>

          <button class="tool-button" type="button" data-panel="canvas" aria-expanded="false" title="Canvas">
            <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3.5" y="3.5" width="17" height="17" rx="2.5"></rect>
              <path d="M9 3.5v17M15 3.5v17M3.5 9h17M3.5 15h17"></path>
            </svg>
            <span class="tool-label">Canvas</span>
          </button>

          <button class="tool-button" type="button" data-panel="supports" aria-expanded="false" title="Supports">
            <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 5 6.5 15h11L12 5Z"></path>
              <path d="M4 18h16"></path>
              <path d="m6 18-2 2M10 18l-2 2M14 18l-2 2M18 18l-2 2"></path>
            </svg>
            <span class="tool-label">Supports</span>
          </button>

          <button class="tool-button" type="button" data-panel="calculations" aria-expanded="false" title="Calculations">
            <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="2.8" width="16" height="18.4" rx="2.5"></rect>
              <path d="M7.5 7h9"></path>
              <path d="M8 12h2M14 12h2M8 16.5h2M14 16.5h2"></path>
            </svg>
            <span class="tool-label">Calculations</span>
          </button>
        </nav>

        <section class="panel-area" aria-live="polite">
          <div class="tool-panel" data-panel-content="shapes" hidden>
            <h2>Shapes</h2>
            <div class="shape-grid" aria-label="Shape tools">
              <button class="shape-option" type="button" data-shape="rectangle">
                <span class="shape-preview shape-rectangle" aria-hidden="true"></span>
                <span>Rectangle</span>
              </button>

              <button class="shape-option" type="button" data-shape="triangle">
                <span class="shape-preview shape-triangle" aria-hidden="true"></span>
                <span>Triangle</span>
              </button>

              <button class="shape-option" type="button" data-shape="circle">
                <span class="shape-preview shape-circle" aria-hidden="true"></span>
                <span>Circle</span>
              </button>

              <button class="shape-option" type="button" data-shape="particle">
                <span class="shape-preview shape-particle" aria-hidden="true"></span>
                <span>Particle</span>
              </button>

              <button class="shape-option" type="button" data-shape="polygon">
                <span class="shape-preview shape-polygon" aria-hidden="true"></span>
                <span>Polygon</span>
              </button>
            </div>
          </div>

          <div class="tool-panel" data-panel-content="forces" hidden>
            <h2>Forces</h2>
            <p>Force tools will go here.</p>
          </div>

          <div class="tool-panel" data-panel-content="canvas" hidden>
            <h2>Canvas</h2>
            <p>Canvas controls will go here.</p>
          </div>

          <div class="tool-panel" data-panel-content="supports" hidden>
            <h2>Supports</h2>
            <p>Support tools will go here.</p>
          </div>

          <div class="tool-panel" data-panel-content="calculations" hidden>
            <h2>Calculations</h2>
            <p>Calculation tools will go here.</p>
          </div>
        </section>
      </aside>

      <main class="workspace" aria-label="Diagram workspace">
        <div class="grid-canvas" aria-label="Gridded free-body diagram canvas"></div>
      </main>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
